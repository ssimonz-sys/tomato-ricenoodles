<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/graphics/favicon.svg">
<title>作品管理 | Tomato Ricenoodles</title>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/admin-edition-home.css">
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const lang=p.get('lang');
  const hasLegacy=p.has('id')||p.has('chapter')||p.has('book');
  if((lang==='zh'||lang==='en')&&!hasLegacy){
    p.delete('lang');
    location.replace('/admin/'+lang+'/manage/'+(p.toString()?'?'+p:''));
  }else if(hasLegacy){
    if((lang==='zh'||lang==='en')){
      p.delete('lang');
      location.replace('/admin/'+lang+'/manage/'+(p.toString()?'?'+p:''));
    }else{
      location.replace('/admin/legacy/manage/'+location.search);
    }
  }else if(p.has('new')){
    location.replace('/admin/zh/'+location.search);
  }
})();
</script>
</head><body class="edition-home">
<main class="edition-home-inner">
<p class="eyebrow">TOMATO RICENOODLES · AUTHOR WORKSPACE</p>
<h1 class="edition-home-title">选择作品管理后台</h1>
<p class="edition-home-description">中文作品与英文作品分开管理。管理员密码、数据库、封面存储和现有文章保持不变。</p>
<div class="edition-home-grid">
<a class="edition-home-card" href="/admin/zh/manage/">
<span class="mode">中文站 · CHINESE</span><strong>番茄米线</strong>
<small>管理中文系列、书籍、章节、文章与评论</small>
<span class="edition-home-options"><span>进入中文书架 →</span></span>
</a>
<a class="edition-home-card" href="/admin/en/manage/">
<span class="mode">ENGLISH EDITION</span><strong>Tomato Ricenoodles</strong>
<small>Manage English collections, books, chapters, posts, and comments.</small>
<span class="edition-home-options"><span>Open English Library →</span></span>
</a></div>
<p class="edition-home-foot"><a href="/admin/">前往写作后台</a>　·　<a href="/zh/">中文首页</a>　·　<a href="/en/">English home</a></p>
</main></body></html>
